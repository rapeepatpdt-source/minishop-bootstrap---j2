<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - MiniShop</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">

                <div class="card border-0 shadow-sm p-4 rounded-3">
                    <h3 class="text-center fw-bold text-dark mb-4">🔑 เข้าสู่ระบบ</h3>

                    <form action="#">
                        <div class="mb-3">
                            <label for="email" class="form-label fs-6 fw-medium text-secondary">อีเมลผู้ใช้งาน</label>
                            <input type="email" id="email" class="form-control" placeholder="name@example.com">
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fs-6 fw-medium text-secondary">รหัสผ่าน</label>
                            <input type="password" id="password" class="form-control" placeholder="••••••••">
                        </div>

                        <button type="submit" class="btn btn-danger w-100 fw-bold py-2">🔓 เข้าสู่ระบบ</button>
                    </form>

                    <div class="text-center mt-3">
                        <p class="fs-6 text-muted m-0">ยังไม่มีบัญชี? <a href="register.html"
                                class="text-danger fw-semibold">สมัครสมาชิกเลย</a></p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
