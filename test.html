<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>ทดสอบ JavaScript</title>

    <!-- 🔗 ส่วนสำคัญ: เรียกใช้ไฟล์ app.js ที่อยู่ในโฟลเดอร์ js ไว้ในส่วน Header -->

</head>

<body>
  
<hr>
<hr>
    <h2>🛒 ระบบจัดการตะกร้าสินค้า</h2>
    
    <div style="background-color: #f0f0f0; padding: 10px; margin-bottom: 20px;">
        <label>ชื่อสินค้า:</label>
        <input type="text" id="newNameInput" placeholder="เช่น เคสโทรศัพท์">
        
        <label>ราคา (บาท):</label>
        <input type="number" id="newPriceInput" placeholder="0">
        
        <button id="addBtn">เพิ่มลงตะกร้า</button>
    </div>

    <!-- 🌟 เพิ่มปุ่มล้างตะกร้าตรงนี้ -->
    <button id="clearBtn" style="color: red;">🗑️ ล้างตะกร้าทั้งหมด</button>

    <ul id="orderList"></ul>
    <h3 id="totalPriceDisplay">ยอดรวมทั้งสิ้น: 0 บาท</h3>

    <script src="js/app.js"></script>


  
</body>

</html>
