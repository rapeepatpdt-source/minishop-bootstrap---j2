<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - MiniShop</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>

<body class="bg-light">

    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">

                <div class="card border-0 shadow-sm p-4 rounded-3">
                    <h3 class="text-center fw-bold text-dark mb-4">📝 สมัครสมาชิกใหม่</h3>

                    <form action="#">

                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label text-secondary fs-6">ชื่อจริง</label>
                                <input type="text" class="form-control" placeholder="สมชาย">
                            </div>
                            <div class="col-6">
                                <label class="form-label text-secondary fs-6">นามสกุล</label>
                                <input type="text" class="form-control" placeholder="ตั้งใจเรียน">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary fs-6">ระบุเพศ</label>
                            <div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="male" value="m">
                                    <label class="form-check-label text-dark" for="male">ชาย</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="female" value="f">
                                    <label class="form-check-label text-dark" for="female">หญิง</label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary fs-6">เบอร์โทรศัพท์ติดต่อ (เฉพาะตัวเลข 9
                                หลักหลังรหัสประเทศ)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted fw-medium">+66</span>
                                <input type="tel" class="form-control" placeholder="812345678" pattern="[0-9]{9}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary fs-6">ประเภทสมาชิก</label>
                            <select class="form-select">
                                <option value="" selected disabled>-- เลือกประเภทสมาชิก --</option>
                                <option value="1">ลูกค้าทั่วไป</option>
                                <option value="2">ร้านค้า / ตัวแทนจำหน่าย</option>
                            </select>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                            <label for="floatingPassword" class="text-secondary">ตั้งรหัสผ่านใหม่ (อย่างน้อย 8
                                ตัวอักษร)</label>
                        </div>

                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="switchNewsletter">
                                <label class="form-check-label text-secondary fs-6"
                                    for="switchNewsletter">เปิดรับข่าวสารและโปรโมชันพิเศษทางอีเมล</label>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="agreeCheckbox">
                                <label class="form-check-label text-secondary fs-6" for="agreeCheckbox">
                                    ฉันยอมรับเงื่อนไขและข้อตกลงการใช้งานระบบทุกประการ
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 fw-bold py-2">✨ ลงทะเบียนสมาชิก</button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="login.html" class="text-secondary fs-6">← กลับไปหน้าเข้าสู่ระบบ</a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
